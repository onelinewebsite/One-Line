    (function(){
      var p=location.pathname||'/',m=p.indexOf('/catalog/'),base;
      if(/^\/share\/(?:item|category|product|retail-category)\//.test(p)) base='/';
      else if(m>=0) base=p.slice(0,m+1);
      else if(p.endsWith('/')) base=p;
      else base=p.slice(0,p.lastIndexOf('/')+1)||'/';
      document.write('<base href="'+base.replace(/"/g,'&quot;')+'">');
    })();
  </script>
